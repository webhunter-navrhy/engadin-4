{% macro stitek(t, cls='') %}<div class="stitek {{ cls }}"><svg viewBox="0 0 12 12"><path d="M6 0L12 6L6 12L0 6Z"/></svg><i></i><span>{{ t }}</span><i></i><svg viewBox="0 0 12 12"><path d="M6 0L12 6L6 12L0 6Z"/></svg></div>{% endmacro %}

{% macro titulni(nadpis, foto, alt, pozice='50% 50%') %}
<section class="titulni">
  {{ img(foto, alt, sizes='100vw', styl='object-position:' ~ pozice) }}
  <h1>{{ nadpis }}</h1>
</section>
{% endmacro %}
